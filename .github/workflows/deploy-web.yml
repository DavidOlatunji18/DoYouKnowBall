# Tests the Flutter app, builds the web version and publishes it to Azure Static Web
# Apps on every push to main that touches the app. Can also be run by hand from the
# Actions tab.
#
# One-time setup: save the Static Web App's deploy token as a GitHub secret (see
# infra/deploy.md, "The website").
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Run app tests
        run: flutter test
      - name: Build the website
        # Release builds point at the live API (AppConfig.production).
        run: flutter build web --release

      - name: Publish to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          action: upload
          app_location: mobile/build/web
          skip_app_build: true
          skip_api_build: true
