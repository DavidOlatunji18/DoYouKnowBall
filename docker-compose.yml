services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server has no ARM64 image; on Apple Silicon this runs under Rosetta
    # (Docker Desktop > Settings > General > "Use Rosetta for x86_64/amd64 emulation").
    platform: linux/amd64
    container_name: dykb-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
